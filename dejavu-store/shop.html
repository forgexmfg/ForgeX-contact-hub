<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1a24">
  <meta name="description" content="Explore Dejavu Decor's wall art, personalized pieces, frames, gifts, and made-to-order designs.">
  <title>Shop | Dejavu Decor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="store.css">
  <script src="data.js" defer></script>
  <script src="store.js" defer></script>
</head>
<body data-page="shop">
  <div id="site-header"></div>
  <main class="shop-page section-wrap">
    <div class="page-intro"><p class="eyebrow">The Dejavu collection</p><h1>Pieces for your place.</h1><p>Find a considered detail, or make one personal to you.</p></div>
    <div class="shop-toolbar">
      <button class="filter-toggle" type="button" data-filter-toggle><i class="fa-solid fa-sliders" aria-hidden="true"></i> Filters</button>
      <p data-result-count></p>
      <label class="sort-control">Sort <select data-filter="sort"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="name">Name</option></select></label>
    </div>
    <div class="shop-layout">
      <aside class="filters" data-filters>
        <div class="filter-heading"><h2>Refine</h2><button type="button" class="text-link" data-clear-filters>Clear all</button></div>
        <label>Category<select data-filter="category"><option value="all">All categories</option></select></label>
        <label>Price range<select data-filter="price"><option value="all">Any price</option><option value="0-400">Under EGP 400</option><option value="400-600">EGP 400–600</option><option value="600-1000">EGP 600–1,000</option></select></label>
        <label>Material<select data-filter="material"><option value="all">All materials</option></select></label>
        <label>Style<select data-filter="style"><option value="all">All styles</option></select></label>
        <label class="check-filter"><input type="checkbox" data-filter="availability"> Available now</label>
      </aside>
      <div class="shop-results"><div class="product-grid shop-grid" data-shop-grid></div><p class="empty-state" data-empty-state hidden>No pieces match these filters yet. Try a different combination.</p></div>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
